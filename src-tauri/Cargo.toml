[package]
name = "aniwall"
version = "0.1.0"
description = "AniWall — KDE 动态壁纸管理器：下载 / 管理 / 一键切换"
authors = ["AniWall contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/qingzhenzi/aniwall"
homepage = "https://github.com/qingzhenzi/aniwall"

[lib]
name = "aniwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建：使用内嵌资源（tauri build 会自动加上）
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
